<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Search Navigator — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #111113;
    --line: rgba(255, 255, 255, 0.09);
    --violet: #7c3aed;
    --text: #f5f4f8;
    --text-muted: #8d8a99;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 6vw;
    border-right: 1px solid var(--line);
  }

  .rail-mark {
    width: 22px;
    height: 3px;
    background: var(--violet);
    margin-bottom: 1.6rem;
  }

  .kicker {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1.3rem;
  }

  h1 {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(2.1rem, 3.6vw, 3.2rem);
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin-bottom: 1.2rem;
  }

  .subhead {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--text-muted);
    max-width: 420px;
    margin-bottom: 2rem;
  }

  .cta {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    background: transparent;
    color: var(--violet);
    border: 1px solid var(--violet);
    padding: 0.75rem 1.4rem;
    border-radius: 0;
    cursor: pointer;
    width: fit-content;
  }

  .badge {
    margin-top: 2.2rem;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .badge span { color: var(--violet); }

  /* Right: flat ledger grid -- pure tiled cells, no blur, no shadow */
  .ledger {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
  }
  .cell {
    border: 1px solid var(--line);
    margin: -1px 0 0 -1px;
  }
  .cell.fill { background: var(--violet); }
  .cell.dim { background: rgba(255, 255, 255, 0.02); }
  .cell.num {
    display: flex;
    align-items: flex-end;
    padding: 0.6rem;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<section class="hero">
  <div class="left">
    <div class="rail-mark"></div>
    <div class="kicker">For job seekers in India</div>
    <h1>Your job search, actually organized.</h1>
    <p class="subhead">Rank real listings against your LinkedIn profile, get an ATS-ready CV in minutes, and track every application — all running locally on your machine.</p>
    <button class="cta">See how it works</button>
    <div class="badge">Ledger <span>· v2</span></div>
  </div>
  <div class="ledger" id="ledger"></div>
</section>
<script>
  const ledger = document.getElementById("ledger");
  const total = 24;
  const fillIndex = 9;
  for (let i = 0; i < total; i++) {
    const cell = document.createElement("div");
    cell.className = "cell" + (i === fillIndex ? " fill" : i % 5 === 0 ? " dim num" : "");
    if (i % 5 === 0 && i !== fillIndex) cell.textContent = (i * 7 + 12) + "";
    ledger.appendChild(cell);
  }
</script>
</body>
</html>
