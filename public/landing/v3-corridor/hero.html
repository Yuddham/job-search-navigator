<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Search Navigator — Corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #08080a;
    --violet: #5b4fe8;
    --text: #f2f1f6;
    --text-muted: #918da3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 0 7vw;
    perspective: 1000px;
  }

  /* Receding panels along the left, suggesting a sidebar rail extending
     into depth. Rim-light via box-shadow on the edge, not a fill glow. */
  .corridor {
    position: absolute;
    left: 3vw;
    top: 0;
    height: 100%;
    width: 30vw;
    transform-style: preserve-3d;
  }
  .panel {
    position: absolute;
    left: 0;
    width: 200px;
    height: 120px;
    background: #101014;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 6px;
  }
  .panel.a { top: 12%;  transform: rotateY(28deg) translateZ(0px)   scale(1);    box-shadow: 4px 0 24px -8px var(--violet); }
  .panel.b { top: 34%;  transform: rotateY(28deg) translateZ(-90px) scale(0.86); opacity: 0.75; box-shadow: 3px 0 18px -8px var(--violet); }
  .panel.c { top: 54%;  transform: rotateY(28deg) translateZ(-180px) scale(0.72); opacity: 0.5; }
  .panel.d { top: 72%;  transform: rotateY(28deg) translateZ(-270px) scale(0.58); opacity: 0.3; }

  .content {
    position: relative;
    z-index: 2;
    max-width: 620px;
    margin-left: 30vw;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,0.6));
  }

  .kicker {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--violet);
    margin-bottom: 1.4rem;
  }

  h1 {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 4vw, 3.5rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: 1.3rem;
  }

  .subhead {
    font-size: 1.02rem;
    line-height: 1.6;
    color: var(--text-muted);
    max-width: 460px;
    margin-bottom: 2.2rem;
  }

  .cta {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 500;
    font-size: 0.92rem;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--violet);
    padding: 0.8rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: inset 0 0 0 0 var(--violet);
  }

  .badge {
    display: block;
    margin-top: 2.2rem;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .badge span { color: var(--violet); }
</style>
</head>
<body>
<section class="hero">
  <div class="corridor">
    <div class="panel a"></div>
    <div class="panel b"></div>
    <div class="panel c"></div>
    <div class="panel d"></div>
  </div>
  <div class="content">
    <div class="kicker">For job seekers in India</div>
    <h1>Your job search, actually organized.</h1>
    <p class="subhead">Rank real listings against your LinkedIn profile, get an ATS-ready CV in minutes, and track every application — all running locally on your machine.</p>
    <button class="cta">See how it works</button>
    <span class="badge">Corridor <span>· v3</span></span>
  </div>
</section>
</body>
</html>
