<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Search Navigator — Aurora Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0c;
    --violet-a: #7c3aed;
    --violet-b: #b06ff5;
    --text: #f4f3f8;
    --text-muted: #8d899c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
  }

  /* Tick marks along the left edge, echoing a sidebar rail without
     drawing a literal nav */
  .ticks {
    position: absolute;
    top: 0; left: 3.2vw;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
  }
  .ticks span {
    width: 10px;
    height: 1px;
    background: rgba(255, 255, 255, 0.14);
  }

  .content {
    max-width: 600px;
    margin-bottom: 3.5rem;
  }

  .kicker {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1.2rem;
  }

  h1 {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 4vw, 3.6rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
  }

  /* The single deliberate gradient in this composition -- applied only to
     a thin 2px line, never as a background wash. */
  .line {
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, var(--violet-a), var(--violet-b) 60%, transparent);
    margin: 2.6rem 0;
  }

  .lower { display: flex; justify-content: space-between; align-items: flex-end; }

  .subhead {
    font-size: 0.98rem;
    line-height: 1.6;
    color: var(--text-muted);
    max-width: 420px;
  }

  .cta {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 500;
    font-size: 0.88rem;
    background: none;
    color: var(--violet-b);
    border: none;
    border-bottom: 1px solid var(--violet-b);
    padding: 0 0 0.2rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .badge {
    position: absolute;
    bottom: 5vh;
    left: 8vw;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .badge span { color: var(--violet-b); }
</style>
</head>
<body>
<section class="hero">
  <div class="ticks">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="content">
    <div class="kicker">For job seekers in India</div>
    <h1>Your job search, actually organized.</h1>
  </div>
  <div class="line"></div>
  <div class="lower">
    <p class="subhead">Rank real listings against your LinkedIn profile, get an ATS-ready CV in minutes, and track every application — all running locally on your machine.</p>
    <button class="cta">See how it works</button>
  </div>
  <div class="badge">Aurora Line <span>· v5</span></div>
</section>
</body>
</html>
